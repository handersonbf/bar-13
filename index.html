<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <title>Bar13 | Apresentação</title>

    <style>
      :root {
        color-scheme: dark;
        --bg: #080808;
        --text: #f4f1ea;
        --muted: #b8b0a4;
        --gold: #d4a437;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
        text-align: center;
      }

      main {
        max-width: 520px;
      }

      h1 {
        margin: 0 0 12px;
        color: var(--gold);
        font-size: clamp(2.4rem, 9vw, 4.2rem);
        line-height: 1;
      }

      p {
        margin: 0 0 20px;
        color: var(--muted);
      }

      a {
        display: inline-flex;
        min-height: 46px;
        align-items: center;
        justify-content: center;
        border-radius: 8px;
        padding: 0 18px;
        background: var(--gold);
        color: #17120a;
        font-weight: 900;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Bar13</h1>
      <p>Redirecionando para a apresentação visual do sistema.</p>
